[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "icode-data-server"
version = "0.1.0"
description = "iCode fact-reporting ingest service (report/1.0)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2",
  "asyncpg",
  "boto3",
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio",
  "httpx",
  "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/icode_data_server"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
